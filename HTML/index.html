<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MsCafe | Best Coffee in Hyderabad</title>
    <meta name="description" content="MsCafe - Founded with a simple mission to serve the best coffee in Hyderabad. Experience premium coffee in a user-friendly atmosphere.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-primary: #3d2b1f;
            --color-secondary: #c9a66b;
            --color-accent: #f5e6d3;
            --font-playfair: 'Playfair Display', serif;
            --font-inter: 'Inter', sans-serif;
        }

        body {
            @apply font-inter bg-accent text-primary;
        }

        h1, h2, h3 {
            @apply font-playfair;
        }

        .glass-effect {
            @apply bg-white/10 backdrop-blur-md border border-white/20;
        }

        .btn-premium {
            @apply px-8 py-3 bg-primary text-accent font-semibold transition-all duration-300 hover:bg-secondary hover:text-primary rounded-full;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? 'bg-primary/90 py-2 shadow-lg' : 'bg-transparent py-4'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <div className="text-2xl font-bold font-playfair tracking-wider" style={{ color: isScrolled ? '#f5e6d3' : '#3d2b1f' }}>
                            MsCafe
                        </div>
                        <div className={`hidden md:flex space-x-8 font-medium ${isScrolled ? 'text-accent' : 'text-primary'}`}>
                            <a href="#" className="hover:text-secondary transition-colors">Home</a>
                            <a href="#menu" className="hover:text-secondary transition-colors">Menu</a>
                            <a href="#about" className="hover:text-secondary transition-colors">About</a>
                            <a href="#contact" className="hover:text-secondary transition-colors">Contact</a>
                        </div>
                        <button className="md:hidden text-primary">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                        </button>
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="relative h-screen flex items-center justify-center overflow-hidden">
                <div className="absolute inset-0 z-0">
                    <img src="mscafe_hero_coffee_1766588105204.png" alt="MsCafe Specialty Coffee" className="w-full h-full object-cover filter brightness-[0.6]" />
                </div>
                <div className="relative z-10 text-center text-accent px-6">
                    <h1 className="text-5xl md:text-8xl font-bold mb-6 animate-fade-in-down">MsCafe</h1>
                    <p className="text-xl md:text-2xl mb-8 max-w-2xl mx-auto font-light leading-relaxed">
                        Founded with a simple mission: to serve the best coffee in Hyderabad. 
                        Experience the art of roasting and brewing.
                    </p>
                    <div className="flex flex-col md:flex-row gap-4 justify-center">
                        <a href="#menu" className="btn-premium">Explore Menu</a>
                        <a href="#about" className="px-8 py-3 border-2 border-accent text-accent font-semibold rounded-full transition-all duration-300 hover:bg-accent hover:text-primary">Our Story</a>
                    </div>
                </div>
                <div className="absolute bottom-10 left-1/2 -translate-x-1/2 animate-bounce">
                    <svg className="w-8 h-8 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 14l-7 7-7-7"></path></svg>
                </div>
            </section>
        );

        const Menu = () => {
            const menuItems = [
                { name: 'House Latte', price: '₹220', desc: 'Double shot espresso with silky micro-foam.' },
                { name: 'Cold Brew', price: '₹260', desc: '18-hour slow steeped specialty beans.' },
                { name: 'Saffron Espresso', price: '₹280', desc: 'A Hyderabadi twist on the classic Italian shot.' },
                { name: 'Avocado Toast', price: '₹350', desc: 'Sourdough with chili flakes and feta.' },
                { name: 'Iranian Chai', price: '₹80', desc: 'Traditional creamy tea from the heart of Hyderabad.' },
                { name: 'Tiramisu', price: '₹320', desc: 'Coffee-soaked sponge with mascarpone cream.' },
            ];

            return (
                <section id="menu" className="py-24 bg-accent">
                    <div className="container mx-auto px-6">
                        <div className="text-center mb-16">
                            <h2 className="text-4xl md:text-5xl font-bold mb-4">Our Signature Menu</h2>
                            <div className="w-24 h-1 bg-secondary mx-auto mb-8"></div>
                            <p className="text-gray-600 max-w-xl mx-auto">Crafted with beans sourced from the finest estates, prepared with passion.</p>
                        </div>
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-10">
                            {menuItems.map((item, index) => (
                                <div key={index} className="flex flex-col p-6 rounded-2xl bg-white border border-secondary/20 shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all duration-300">
                                    <div className="flex justify-between items-start mb-4">
                                        <h3 className="text-xl font-bold">{item.name}</h3>
                                        <span className="text-secondary font-bold text-lg">{item.price}</span>
                                    </div>
                                    <p className="text-gray-600 italic mt-2">{item.desc}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const About = () => (
            <section id="about" className="py-24 bg-primary text-accent">
                <div className="container mx-auto px-6 grid md:grid-cols-2 items-center gap-16">
                    <div className="relative group overflow-hidden rounded-3xl">
                        <img src="mscafe_interior_cozy_1766588124590.png" alt="MsCafe Interior" className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                        <div className="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                    </div>
                    <div className="space-y-8">
                        <h2 className="text-4xl md:text-5xl font-bold">The Heart of Hyderabad</h2>
                        <div className="w-20 h-1 bg-secondary"></div>
                        <p className="text-lg leading-relaxed text-gray-300">
                            MsCafe was born from a deep love for coffee culture and the vibrant spirit of Hyderabad. 
                            Our journey began in a small corner of the city, driven by a simple yet ambitious goal: 
                            to create a space where every cup tells a story of quality, community, and craft.
                        </p>
                        <p className="text-lg leading-relaxed text-gray-300">
                            We don't just serve coffee; we serve experiences. Every bean is hand-selected and roasted 
                            to perfection to bring out its unique profile, ensuring that every sip is as memorable as the first.
                        </p>
                        <div className="pt-4">
                            <button className="btn-premium">Read More About Us</button>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Contact = () => (
            <section id="contact" className="py-24 bg-white">
                <div className="container mx-auto px-6">
                    <div className="grid md:grid-cols-2 gap-16">
                        <div className="space-y-8">
                            <h2 className="text-4xl font-bold">Visit MsCafe</h2>
                            <p className="text-gray-600 text-lg">Come and enjoy the best coffee in Hyderabad. We'd love to host you.</p>
                            <div className="space-y-6">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-full bg-accent flex items-center justify-center text-primary">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    </div>
                                    <div>
                                        <h4 className="font-bold">Location</h4>
                                        <p className="text-gray-500">Banjara Hills, Road No. 12, Hyderabad, TS</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 rounded-full bg-accent flex items-center justify-center text-primary">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    </div>
                                    <div>
                                        <h4 className="font-bold">Opening Hours</h4>
                                        <p className="text-gray-500">Mon - Sun: 7:00 AM - 11:00 PM</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="bg-accent p-8 rounded-3xl">
                            <form className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Full Name</label>
                                    <input type="text" className="w-full px-4 py-3 rounded-xl border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="John Doe" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Email</label>
                                    <input type="email" className="w-full px-4 py-3 rounded-xl border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-primary outline-none transition-all" placeholder="john@example.com" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold mb-2">Message</label>
                                    <textarea className="w-full px-4 py-3 rounded-xl border-none ring-1 ring-gray-200 focus:ring-2 focus:ring-primary outline-none transition-all h-32" placeholder="Tell us something..."></textarea>
                                </div>
                                <button type="button" className="w-full btn-premium mt-4">Send Message</button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-12 bg-primary text-accent/60 border-t border-accent/10">
                <div className="container mx-auto px-6 text-center">
                    <div className="text-3xl font-playfair font-bold text-accent mb-6">MsCafe</div>
                    <div className="flex justify-center space-x-6 mb-8">
                        <a href="#" className="hover:text-secondary transition-colors">Instagram</a>
                        <a href="#" className="hover:text-secondary transition-colors">Twitter</a>
                        <a href="#" className="hover:text-secondary transition-colors">Facebook</a>
                    </div>
                    <p className="text-sm">© 2025 MsCafe Hyderabad. All rights reserved.</p>
                </div>
            </footer>
        );

        const App = () => (
            <div className="min-h-screen">
                <Navbar />
                <Hero />
                <Menu />
                <About />
                <Contact />
                <Footer />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
